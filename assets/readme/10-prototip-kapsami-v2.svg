<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">9. Sınıf Türk Dili ve Edebiyatı için teorik yıllık ölçek</title>
  <desc id="desc">Öğrenci evreni, resmî sınav evrakı ve öğretmen onaylı analiz raporu sayılarını gösteren MAHİR infografiği.</desc>

  <rect width="1600" height="900" fill="#F7FAFA"/>
  <rect x="0" y="0" width="1600" height="18" fill="#0B6B6F"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="100" y="70" fill="#0B6B6F" font-size="22" font-weight="700" letter-spacing="2">MAHİR  |  KAPSAM VE ÖLÇEK</text>
    <text x="100" y="145" fill="#0B2F4F" font-size="46" font-weight="700">9. Sınıf Türk Dili ve Edebiyatı İçin Teorik Yıllık Ölçek</text>
    <text x="100" y="198" fill="#40596B" font-size="25">Öğrenme kanıtlarına dayalı, öğretmen denetimli analiz ve raporlama modeli</text>
    <line x1="100" y1="230" x2="1500" y2="230" stroke="#B8D4D4" stroke-width="2"/>

    <!-- Kart 1 -->
    <g>
      <rect x="100" y="280" width="440" height="275" rx="10" fill="#FFFFFF" stroke="#B8D4D4" stroke-width="2"/>
      <rect x="100" y="280" width="440" height="12" rx="6" fill="#69B9B7"/>
      <circle cx="165" cy="352" r="34" fill="#E5F3F2"/>
      <g transform="translate(143 331)" fill="none" stroke="#0B6B6F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="22" cy="12" r="9"/>
        <path d="M7 40c2-10 9-15 15-15s13 5 15 15"/>
        <circle cx="5" cy="18" r="6"/>
        <circle cx="39" cy="18" r="6"/>
      </g>
      <text x="215" y="345" fill="#0B2F4F" font-size="22" font-weight="700">ÖĞRENCİ EVRENİ</text>
      <text x="140" y="432" fill="#0B2F4F" font-size="52" font-weight="700">984.390</text>
      <text x="140" y="480" fill="#40596B" font-size="22">9. sınıf düzeyindeki örgün eğitim</text>
      <text x="140" y="514" fill="#40596B" font-size="22">öğrencileri</text>
    </g>

    <!-- Kart 2 -->
    <g>
      <rect x="580" y="280" width="440" height="275" rx="10" fill="#FFFFFF" stroke="#B8D4D4" stroke-width="2"/>
      <rect x="580" y="280" width="440" height="12" rx="6" fill="#0D8F91"/>
      <circle cx="645" cy="352" r="34" fill="#E5F3F2"/>
      <g transform="translate(627 329)" fill="none" stroke="#0B6B6F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 2h24l10 10v34H4z"/>
        <path d="M28 2v12h10M11 24h20M11 33h20"/>
      </g>
      <text x="695" y="345" fill="#0B2F4F" font-size="22" font-weight="700">RESMÎ SINAV EVRAKI</text>
      <text x="620" y="432" fill="#0B2F4F" font-size="52" font-weight="700">3.937.560</text>
      <text x="620" y="480" fill="#40596B" font-size="22">Yılda dört yazılı sınav varsayımına</text>
      <text x="620" y="514" fill="#40596B" font-size="22">dayalı teorik evrak sayısı</text>
    </g>

    <!-- Kart 3 -->
    <g>
      <rect x="1060" y="280" width="440" height="275" rx="10" fill="#FFFFFF" stroke="#B8D4D4" stroke-width="2"/>
      <rect x="1060" y="280" width="440" height="12" rx="6" fill="#0B2F4F"/>
      <circle cx="1125" cy="352" r="34" fill="#E5F3F2"/>
      <g transform="translate(1105 330)" fill="none" stroke="#0B6B6F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="36" height="42" rx="2"/>
        <path d="M10 33l7-8 6 5 8-12M10 12h12"/>
      </g>
      <text x="1175" y="337" fill="#0B2F4F" font-size="20" font-weight="700">KANITA DAYALI</text>
      <text x="1175" y="365" fill="#0B2F4F" font-size="20" font-weight="700">RAPORLAMA</text>
      <text x="1100" y="432" fill="#0B2F4F" font-size="52" font-weight="700">156.964</text>
      <text x="1100" y="480" fill="#40596B" font-size="22">Öğretmen onaylı sınıf-sınav</text>
      <text x="1100" y="514" fill="#40596B" font-size="22">analiz raporu potansiyeli</text>
    </g>

    <!-- Süreç şeridi -->
    <rect x="100" y="610" width="1400" height="105" rx="10" fill="#E5F3F2" stroke="#9FCACA" stroke-width="2"/>
    <text x="135" y="650" fill="#0B6B6F" font-size="18" font-weight="700" letter-spacing="1.4">MAARİF MODELİYLE UYUMLU KANIT ZİNCİRİ</text>
    <text x="135" y="690" fill="#0B2F4F" font-size="27" font-weight="700">Resmî evrak</text>
    <text x="330" y="690" fill="#0B6B6F" font-size="30">→</text>
    <text x="390" y="690" fill="#0B2F4F" font-size="27" font-weight="700">Doğrulanmış veri</text>
    <text x="650" y="690" fill="#0B6B6F" font-size="30">→</text>
    <text x="710" y="690" fill="#0B2F4F" font-size="27" font-weight="700">Öğrenme kanıtı</text>
    <text x="950" y="690" fill="#0B6B6F" font-size="30">→</text>
    <text x="1010" y="690" fill="#0B2F4F" font-size="27" font-weight="700">Öğretmen onaylı rapor</text>

    <!-- Dipnot -->
    <rect x="100" y="760" width="8" height="78" fill="#0B6B6F"/>
    <text x="130" y="785" fill="#40596B" font-size="19">
      <tspan font-weight="700" fill="#0B2F4F">Hesaplama notu:</tspan>
      <tspan> Değerler teorik yıllık ölçeği gösterir; mevcut kullanıcı, pilot örneklem veya gerçekleşmiş işlem sayısı değildir.</tspan>
    </text>
    <text x="130" y="817" fill="#40596B" font-size="19">Resmî evrak ve analiz raporu farklı sayım birimleridir.</text>
    <text x="1500" y="856" fill="#637786" font-size="17" text-anchor="end">Dayanak: MEB 2024–2025 Örgün Eğitim İstatistikleri  •  Varsayım: yılda dört yazılı sınav</text>
  </g>
</svg>
