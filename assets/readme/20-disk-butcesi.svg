<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>MAHİR disk bütçesi</title>
  <rect width="1200" height="340" rx="18" fill="#ffffff"/>
  <text x="20" y="36" font-size="22" font-weight="700" fill="#0f172a">Disk bütçesi - kurulum bitince ne kadar yer kaplar?</text>

  <text x="20" y="72" font-size="14" font-weight="700" fill="#0f172a">Kalıcı (kurulum sonrası): ≈ 25 GB</text>
  <!-- 1160 px = 25,3 GB -> 45,85 px/GB -->
  <g>
    <rect x="20" y="82" width="481" height="44" fill="#2563eb"/>
    <text x="260" y="110" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Python paketleri 10,5 GB</text>
    <rect x="501" y="82" width="202" height="44" fill="#db2777"/>
    <text x="602" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Qwen LLM 4,4</text>
    <rect x="703" y="82" width="197" height="44" fill="#7c3aed"/>
    <text x="801" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">bge-m3 4,3</text>
    <rect x="900" y="82" width="96" height="44" fill="#0891b2"/>
    <text x="948" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2,1</text>
    <rect x="996" y="82" width="87" height="44" fill="#d97706"/>
    <text x="1039" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1,9</text>
    <rect x="1083" y="82" width="50" height="44" fill="#16a34a"/>
    <text x="1108" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1,1</text>
    <rect x="1133" y="82" width="23" height="44" fill="#64748b"/>
    <rect x="1156" y="82" width="14" height="44" fill="#0f766e"/>
    <rect x="1170" y="82" width="10" height="44" fill="#a16207"/>
    <rect x="20" y="82" width="1160" height="44" fill="none" stroke="#0f172a" stroke-width="1"/>
  </g>

  <text x="20" y="160" font-size="14" font-weight="700" fill="#0f172a">Kurulum sırasında ek (geçici): pip önbelleği 8,5 GB · Docker Desktop programı ~3-4 GB   →   önerilen boş alan: 35 GB</text>
  <g>
    <rect x="20" y="170" width="390" height="28" fill="#cbd5e1"/>
    <text x="215" y="189" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">pip önbelleği 8,5 GB - "pip cache purge" ile silinir</text>
    <rect x="410" y="170" width="160" height="28" fill="#e2e8f0"/>
    <text x="490" y="189" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Docker Desktop ~3,5</text>
    <rect x="20" y="170" width="550" height="28" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
  </g>

  <!-- lejant -->
  <g font-size="13" fill="#334155">
    <rect x="20" y="222" width="13" height="13" fill="#2563eb"/><text x="40" y="233">Python paketleri (.venv) - 10,5 GB</text>
    <rect x="410" y="222" width="13" height="13" fill="#db2777"/><text x="430" y="233">Qwen2.5-7B-Instruct GGUF - 4,4 GB</text>
    <rect x="800" y="222" width="13" height="13" fill="#7c3aed"/><text x="820" y="233">bge-m3 gömme modeli - 4,3 GB</text>
    <rect x="20" y="248" width="13" height="13" fill="#0891b2"/><text x="40" y="259">bge-reranker-v2-m3 - 2,1 GB</text>
    <rect x="410" y="248" width="13" height="13" fill="#d97706"/><text x="430" y="259">PaddleOCR-VL-1.6 + PP-DocLayoutV3 - 1,9 GB</text>
    <rect x="800" y="248" width="13" height="13" fill="#16a34a"/><text x="820" y="259">llama.cpp (CUDA + cudart) - 1,1 GB</text>
    <rect x="20" y="274" width="13" height="13" fill="#64748b"/><text x="40" y="285">Docling düzen modelleri - 0,5 GB</text>
    <rect x="410" y="274" width="13" height="13" fill="#0f766e"/><text x="430" y="285">Qdrant Docker imajı - 0,3 GB</text>
    <rect x="800" y="274" width="13" height="13" fill="#a16207"/><text x="820" y="285">Proje klasörü (PDF dahil) - 0,2 GB</text>
  </g>
  <text x="20" y="318" font-size="12" fill="#64748b">Ölçüm: Windows 11, Python 3.13, RTX 4050 (2026-09). Modeller kullanıcı klasörüne iner (.cache/huggingface, .paddlex); proje klasörü taşınsa da yeniden inmez.</text>
</svg>
